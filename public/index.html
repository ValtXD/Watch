<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Watch</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
</head>
<body>
    <div id="login-screen">
        <div class="glass-panel">
            <h1>NEXUS_SYNC</h1>
            
            <div class="input-group">
                <input type="text" id="input-nome" placeholder="NOME DE OPERADOR">
                <input type="color" id="input-cor" value="#00E5FF" title="Cor do seu nome">
            </div>
            
            <div class="profile-setup-group">
                <div class="upload-wrapper">
                    <img id="preview-foto" src="https://i.imgur.com/7A2y5Zz.png" class="preview-thumb avatar-thumb" alt="Preview Foto">
                    <label class="custom-file-upload btn-cyber alt">
                        FOTO
                        <input type="file" id="input-foto" accept="image/png, image/jpeg, image/jpg">
                    </label>
                </div>
                <div class="upload-wrapper">
                    <div id="preview-banner" class="preview-thumb banner-thumb"></div>
                    <label class="custom-file-upload btn-cyber alt">
                        BANNER
                        <input type="file" id="input-banner" accept="image/png, image/jpeg, image/jpg">
                    </label>
                </div>
            </div>
            
            <button id="btn-criar" class="btn-cyber">INICIAR NOVA REDE</button>
            <div class="divider">CONEXÃO EXTERNA</div>
            <input type="text" id="input-sala" placeholder="CÓDIGO DA REDE (SALA)">
            <input type="password" id="input-senha" placeholder="CHAVE DE ACESSO">
            <button id="btn-entrar" class="btn-cyber alt">CONECTAR</button>
        </div>
    </div>

    <div id="crop-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="crop-title">AJUSTAR IMAGEM</h3>
            <div class="crop-container">
                <img id="crop-image" src="" alt="Cortar Imagem">
            </div>
            <div class="modal-actions">
                <button id="btn-cancel-crop" class="btn-cyber alt">CANCELAR</button>
                <button id="btn-confirm-crop" class="btn-cyber">CONFIRMAR CORTE</button>
            </div>
        </div>
    </div>

    <div id="room-screen" style="display: none;">
        <div class="main-area">
            <div class="header">
                <span id="room-info">REDE: --- | CHAVE: ---</span>
                <div class="controls">
                    <div class="volume-control" title="Ajustar volume da transmissão">
                        <span id="volume-icon">🔊</span>
                        <input type="range" id="input-volume" min="0" max="1" step="0.05" value="1">
                    </div>
                    
                    <label class="custom-file-upload">
                        ALTERAR FUNDO
                        <input type="file" id="input-wallpaper" accept="image/*">
                    </label>
                    
                    <button id="btn-remover-fundo" class="btn-tool" style="background: rgba(255, 50, 50, 0.1); border-color: #ff3333; color: #ff3333; padding: 8px 12px;" title="Remover Fundo">X</button>
                    
                    <button id="btn-mic" class="btn-tool">MIC OFF</button>
                    <button id="btn-tela" class="btn-tool" style="display: none;">TRANSMITIR SINAL</button>
                </div>
            </div>
            
            <div class="video-container" id="video-container">
                <video id="video-local" autoplay muted playsinline style="display: none;"></video>
                <video id="video-remoto" autoplay playsinline></video>
                <div id="no-video-msg">AGUARDANDO SINAL DO HOST...</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">TERMINAL DE COMUNICAÇÃO</div>
            <div id="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="input-chat" placeholder="Inserir comando...">
                <button id="btn-enviar-chat">ENVIAR</button>
            </div>
        </div>
    </div>

    <div id="profile-popup" class="profile-card" style="display: none;">
        <div class="profile-banner" id="popup-banner"></div>
        <div class="profile-pic-container">
            <img id="popup-foto" src="" alt="Avatar">
        </div>
        <div class="profile-info">
            <h3 id="popup-nome">NOME</h3>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
